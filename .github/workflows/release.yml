name: Release

# Changesets two-merge flow: feature PRs carry .changeset/*.md files; on merge
# this workflow opens/updates the "Version Packages" PR (version bump + stamps
# + CHANGELOG). Merging THAT PR is the publish button: npm (trusted
# publishing/OIDC — no tokens), MCP Registry, and a GitHub Release with the
# .mcpb bundle attached.

on:
  push:
    branches: [main]
  # Manual re-publish of the CURRENT server.json to the MCP Registry (e.g. a
  # registry hiccup, or a release where npm was published outside this
  # workflow). OIDC from this org's repo grants the org namespace directly.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  registry-republish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish current server.json to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed — retrying in 90s"
            sleep 90
          done
          exit 1

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Version Packages branch, create the release tag
      pull-requests: write # open/update the Version Packages PR
      id-token: write # npm trusted publishing + MCP Registry github-oidc
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No registry-url here: an .npmrc referencing NODE_AUTH_TOKEN would
        # push npm onto the legacy token path instead of OIDC.

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - name: Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to MCP Registry
        if: steps.changesets.outputs.published == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm CDN metadata can lag a few minutes behind publish — retry.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed (npm CDN lag?) — retrying in 90s"
            sleep 90
          done
          exit 1

      - name: Pack MCPB bundle and attach to the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prune to production deps so the bundle ships only runtime node_modules.
          npm ci --omit=dev
          npx -y @anthropic-ai/mcpb@2.1.2 pack . postfast-mcp.mcpb
          VERSION=$(node -p "require('./package.json').version")
          for TAG in "v${VERSION}" "postfast-mcp@${VERSION}"; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" postfast-mcp.mcpb --clobber
              exit 0
            fi
          done
          echo "no GitHub release found for ${VERSION}" && exit 1

      # TODO(step 2 of the periphery plan): notify social-schedule-mcp once its
      # repository_dispatch receiver workflow exists. Needs a DISPATCH_PAT repo
      # secret (fine-grained PAT: contents+actions on social-schedule-mcp).
      # - name: Notify social-schedule-mcp of the new catalog version
      #   if: steps.changesets.outputs.published == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
      #   run: |
      #     VERSION=$(node -p "require('./package.json').version")
      #     gh api repos/peturgeorgievv-factory/social-schedule-mcp/dispatches \
      #       -f event_type=postfast-mcp-release \
      #       -f "client_payload[version]=${VERSION}"
