name: Release

# Tag-triggered publishing (same model as n8n-nodes-postfast): prepare the
# release locally with `npm run version` (changesets computes the bump +
# changelog, stamp-versions propagates it), commit, then push a vX.Y.Z tag —
# the tag is the publish button. CI holds no registry credentials anywhere:
# npm goes through trusted publishing (OIDC) and the MCP Registry through
# github-oidc, so nothing here needs the "Actions can create PRs" org setting.

on:
  push:
    tags: ["v*.*.*"]
  # Manual re-publish of the CURRENT server.json to the MCP Registry (e.g. a
  # registry hiccup, or a release published outside this workflow). OIDC from
  # this org's repo grants the org namespace directly.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  registry-republish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish current server.json to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed — retrying in 90s"
            sleep 90
          done
          exit 1

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + MCP Registry github-oidc
      contents: write # create the GitHub Release and upload the .mcpb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No registry-url here: an .npmrc referencing NODE_AUTH_TOKEN would
        # push npm onto the legacy token path instead of OIDC.

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - name: Tag must match the stamped version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${PKG} — run npm run version and re-tag"
            exit 1
          fi

      - run: npm run build

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish

      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm CDN metadata can lag a few minutes behind publish — retry.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed (npm CDN lag?) — retrying in 90s"
            sleep 90
          done
          exit 1

      - name: GitHub Release with the MCPB bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest CHANGELOG section (header included) as the release notes.
          awk '/^## /{n++} n==1' CHANGELOG.md > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file /tmp/release-notes.md
          # Prune to production deps so the bundle ships only runtime node_modules.
          npm ci --omit=dev
          npx -y @anthropic-ai/mcpb@2.1.2 pack . postfast-mcp.mcpb
          gh release upload "$GITHUB_REF_NAME" postfast-mcp.mcpb --clobber

      # TODO(step 2 of the periphery plan): notify social-schedule-mcp once its
      # repository_dispatch receiver workflow exists. Needs a DISPATCH_PAT repo
      # secret (fine-grained PAT: contents+actions on social-schedule-mcp).
      # - name: Notify social-schedule-mcp of the new catalog version
      #   env:
      #     GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
      #   run: |
      #     gh api repos/peturgeorgievv-factory/social-schedule-mcp/dispatches \
      #       -f event_type=postfast-mcp-release \
      #       -f "client_payload[version]=${GITHUB_REF_NAME#v}"
